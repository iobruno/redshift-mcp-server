services:
  redshift-mcp-server:
    build: .
    image: redshift-mcp-server:latest
    container_name: redshift-mcp-server
    environment:
      AWS_PROFILE: ${AWS_PROFILE}
      AWS_REGION: ${AWS_REGION}
      REDSHIFT_MCP_PORT: ${REDSHIFT_MCP_PORT:-8000}
      REDSHIFT_MCP_WORKERS: ${REDSHIFT_MCP_WORKERS:-4}
      FASTMCP_LOG_LEVEL: ${FASTMCP_LOG_LEVEL:-INFO}
    ports:
      - "${REDSHIFT_MCP_PORT:-8000}:${REDSHIFT_MCP_PORT:-8000}"
    volumes:
      - ~/.aws:/root/.aws:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${REDSHIFT_MCP_PORT:-8000}/health"]
      interval: 5s
      timeout: 5s
      retries: 3
    restart: on-failure:5
