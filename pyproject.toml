[project]
name = "redshift-mcp-server"
version = "0.1.0"
description = "Redshift MCP Server"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "awslabs-redshift-mcp-server==0.0.30",
    "mcp[cli]>=1.29,<2.0",
    "uvicorn[standard]>=0.51,<1.0",  # [standard] pulls in uvloop + httptools; invoked directly by the Dockerfile's CMD
]

[dependency-groups]
dev = [
    "ruff>=0.16,<1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
skip-magic-trailing-comma = false
preview = true  # unstable: enables 'hug_parens_with_braces_and_square_brackets' for compact StructType([...])

[tool.ruff.lint]
preview = true  # unstable: enables latest lint rules before stabilization
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax for newer Python)
    "B",    # flake8-bugbear (common bug patterns)
    "SIM",  # flake8-simplify (code simplification)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "RUF013",  # implicit Optional
    "F401",    # unused import (side-effect imports, e.g. route registration)
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]  # allow imports not at top in notebooks